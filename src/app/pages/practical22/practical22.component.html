<div class="practical-box">
  <h2>Practical 22 — Reactive Form: User Login</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <label>Email:</label>
    <input type="email" formControlName="email">
    <div class="error" *ngIf="email?.invalid && (email?.touched || submitted)">
      Valid email is required.
    </div>

    <label>Password:</label>
    <input type="password" formControlName="password">
    <div class="error" *ngIf="password?.invalid && (password?.touched || submitted)">
      Password must be at least 6 characters.
    </div>

    <button type="submit">Login</button>
  </form>

  <div class="success" *ngIf="submitted && loginForm.valid">
    ✅ Login successful!
  </div>
</div>
