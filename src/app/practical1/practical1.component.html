<div class="profile-card">
  <div class="photo-wrapper">
    @if (user.photo) {
      <img [src]="user.photo" alt="Profile Photo" width="150" height="150" />
    } @else {
      <div class="photo-placeholder" style="width:150px;height:150px;border-radius:50%;background:#e0e0e0;display:flex;align-items:center;justify-content:center;">
        <span>No Photo</span>
      </div>
    }
  </div>

  <h2>User Profile</h2>

  <div class="info-list">
    <p>
      <span class="label">Name</span><span class="value">{{ user.name }}</span>
    </p>
    <p>
      <span class="label">Email</span
      ><span class="value">{{ user.email }}</span>
    </p>
    <p>
      <span class="label">Age</span><span class="value">{{ user.age }}</span>
    </p>
  </div>

  <button routerLink="/">Back to Home</button>
</div>
