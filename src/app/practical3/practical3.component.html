<div class="table-card">
  <h2>Product List</h2>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Price</th>
          <th>Category</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products">
          <td>{{ product.id }}</td>
          <td>{{ product.name }}</td>
          <td>{{ product.price }}</td>
          <td>
            <span class="badge">{{ product.category }}</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <button routerLink="/">Back to Home</button>
</div>
