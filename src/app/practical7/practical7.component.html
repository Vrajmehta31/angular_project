<div class="container mt-4 p-3">
  <div class="row p-2">
    <div class="col-md-4 mb-3">
      <div class="card shadow h-100">
        <img [src]="studentPhoto" class="card-img-top" height="220" />

        <div class="card-body">
          <h4>{{ studentName }}</h4>
          <p><strong>Course:</strong> {{ studentCourse }}</p>
          <p><strong>Marks:</strong> {{ studentMarks | percent }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
